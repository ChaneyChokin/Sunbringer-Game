<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171329">
<title>合成大挽昼</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#fff9ef;--gold:#f7d487;--gold2:#c99950;--violet:#171329;--glass:rgba(28,23,49,.76)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e1d;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;touch-action:none}button{font:inherit}#app{height:100dvh;min-height:440px;max-width:650px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#45375f 0,#211b38 43%,#12101e 100%);isolation:isolate}#app:before,#app:after{content:"";position:absolute;pointer-events:none;z-index:-1}#app:before{inset:-25%;opacity:.17;background:repeating-conic-gradient(from 0deg at 50% 30%,transparent 0deg 8deg,rgba(251,221,166,.2) 8.2deg 8.7deg,transparent 9deg 18deg);mask-image:linear-gradient(#000,transparent 67%)}#app:after{width:420px;height:420px;left:50%;top:-255px;transform:translateX(-50%);border:1px solid rgba(247,212,135,.35);border-radius:50%;box-shadow:0 0 0 28px rgba(247,212,135,.035),0 0 0 58px rgba(247,212,135,.025),0 0 90px rgba(246,198,116,.23)}
.top{position:absolute;top:max(13px,env(safe-area-inset-top));left:16px;right:16px;height:54px;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.title{font-family:"Ma Shan Zheng",serif;color:#ffe6ae;font-size:clamp(20px,5.7vw,29px);letter-spacing:2px;text-shadow:0 2px 16px #ffc96865;white-space:nowrap}.scorebox{min-width:72px;padding:5px 11px;border:1px solid #ffe5b438;background:linear-gradient(145deg,#fff2d414,#fff2d405);border-radius:13px;text-align:center;box-shadow:inset 0 1px #fff2d414;backdrop-filter:blur(12px)}.scorebox.left{justify-self:start}.scorebox.right{justify-self:end}.scorebox small{display:block;font-size:9px;letter-spacing:2px;color:#dacdbb;opacity:.8}.scorebox strong{font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}.scorebox.left strong{color:#f7d487}.stage{position:absolute;top:78px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}.chain,.next{border:1px solid #fff2d41b;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 8px 25px #08071138;padding:8px 10px}.cap{font-size:9px;letter-spacing:2px;color:#cfc3d9;text-align:center;margin-bottom:7px}.chainrow{display:flex;align-items:center;gap:4px}.chainitem{display:grid;justify-items:center;gap:3px}.chainitem img{width:clamp(25px,7vw,34px);height:clamp(25px,7vw,34px);border-radius:50%;object-fit:cover;border:1.5px solid #efd28f;box-shadow:0 2px 7px #0007}.chainitem span{font-size:7px;color:#e4d8c5;white-space:nowrap}.arr{font-size:10px;color:#d8b56c;margin-top:-10px}.next{min-width:72px;text-align:center;padding:8px 12px}.next img{width:38px;height:38px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);display:block;margin:auto;box-shadow:0 0 15px #f9d78d55}.nextname{font-size:8px;color:#f3e6cd;margin-top:4px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board{position:absolute;width:min(100%,500px);height:min(100%,844px);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}canvas{display:block;width:100%;height:100%}.hint{position:absolute;z-index:4;top:calc(146px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 13px;background:#100d1d7d;border:1px solid #fff2d41a;border-radius:999px;color:#e3d6c4;font-size:10px;letter-spacing:.7px;white-space:nowrap;pointer-events:none}.toast{position:absolute;z-index:9;left:50%;top:37%;transform:translate(-50%,-10px) scale(.92);opacity:0;pointer-events:none;white-space:nowrap;text-align:center;padding:13px 22px;border:1px solid #ffe5a9aa;border-radius:18px;background:linear-gradient(135deg,#322248ed,#171329f2);box-shadow:0 0 40px #f8ce7580,inset 0 1px #fff7dc55;transition:opacity .35s,transform .35s}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.toast b{font-family:"Ma Shan Zheng",serif;font-size:30px;letter-spacing:4px;color:#ffe6ac;text-shadow:0 0 16px #ffda79a8}.toast small{display:block;margin-top:2px;color:#f0dfc5;font-size:10px;letter-spacing:2px}.bottomnote{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:9px;letter-spacing:1.2px;color:#bcb0c7a3;pointer-events:none}.dangerlabel{position:absolute;z-index:5;right:20px;font-size:8px;letter-spacing:1px;color:#ffb2a3;opacity:0;transition:opacity .2s;pointer-events:none}.dangerlabel.show{opacity:.88}
.overlay{position:absolute;inset:0;z-index:20;background:#0d0a17c9;backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:24px}.overlay.show{display:flex}.card{width:min(100%,340px);padding:30px 24px 25px;text-align:center;border:1px solid #f4d79870;border-radius:26px;background:radial-gradient(ellipse at top,#493958,#211a31 58%,#191525);box-shadow:0 20px 80px #05040acc,inset 0 1px #fff4d52d;position:relative;overflow:hidden}.card:before{content:"✦　✧　✦";display:block;color:#f7d487;font-size:18px;letter-spacing:9px;margin-bottom:12px}.card h2{margin:0 0 6px;color:#ffe3a4;font-family:"Ma Shan Zheng",serif;font-size:30px;font-weight:400;letter-spacing:3px}.card .score{font-size:54px;font-weight:900;line-height:1.2;color:#fff7e7;text-shadow:0 0 22px #f5cf8350}.card .label{font-size:10px;letter-spacing:3px;color:#cbbca6;margin-bottom:10px}.card .sub{font-size:12px;color:#d9ccbb;margin:6px 0 22px}.again{border:0;border-radius:999px;padding:12px 42px;background:linear-gradient(180deg,#ffe7ab,#e5b75f);color:#392b22;font-weight:800;box-shadow:0 5px 24px #efbd6050;cursor:pointer}.again:active{transform:scale(.97)}.record{margin-top:15px;font-size:10px;color:#ae9fb5}
@media(max-height:650px){.stage{top:68px}.hint{top:128px}.top{top:8px}.bottomnote{bottom:5px}.chain{padding:6px 7px}.chainitem img{width:25px;height:25px}.chainitem span{display:none}}
</style></head><body><main id="app">
<header class="top"><div class="scorebox left"><small>BEST</small><strong id="best">0</strong></div><div class="title">合成大挽昼</div><div class="scorebox right"><small>SCORE</small><strong id="score">0</strong></div></header>
<section class="stage"><div class="chain"><div class="cap">挽昼进化图鉴</div><div class="chainrow" id="chain"></div></div><div class="next"><div class="cap">下一位</div><img id="nextImg"><div class="nextname" id="nextName"></div></div></section>
<div class="hint" id="hint">按住移动 · 松开发射　　相同头像相遇即可合成</div><div class="dangerlabel" id="dangerLabel">挽昼警戒线</div><div class="toast" id="toast"><b>挽昼降临</b><small>初代虚狩 · 现身于此</small></div>
<div id="board"><canvas id="game"></canvas></div><div class="bottomnote">SHIYANG · A MOMENT BETWEEN SUNSET AND DAWN</div>
<div class="overlay" id="overlay"><section class="card"><h2>此刻，挽昼暂歇</h2><div class="label">本局得分</div><div class="score" id="finalScore">0</div><div class="sub" id="finalSub">下一次，也让挽昼降临吧。</div><button class="again" id="restart">再来一局</button><div class="record" id="record"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script><script>
(()=>{'use strict';
const LEVELS=[{name:'德蕾琪娜·挽昼',img:'assets/lvl1.png',r:23,pts:1},{name:'林德薇恩·挽昼',img:'assets/lvl2.png',r:33,pts:3},{name:'艾尔妲·挽昼',img:'assets/lvl3.png',r:44,pts:6},{name:'邦布·梦游布',img:'assets/lvl4.png',r:57,pts:10},{name:'初代虚狩挽昼',img:'assets/lvl5.png',r:72,pts:20,final:true}];
const W=420,H=780,TOP=190,BOT=738,WALL=10,DANGER=292, DROP=[0,1,2];
const app=document.querySelector('#app'),canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),board=document.querySelector('#board');
const {Engine,World,Bodies,Body,Events}=Matter,engine=Engine.create();engine.gravity.y=1.22;engine.positionIterations=8;engine.velocityIterations=6;
const imgs=LEVELS.map(l=>{const i=new Image();i.src=l.img;return i});let scale=1,ox=0,oy=0;
function layout(){const r=app.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);scale=s;canvas.width=Math.round(W*s*devicePixelRatio);canvas.height=Math.round(H*s*devicePixelRatio);canvas.style.width=W*s+'px';canvas.style.height=H*s+'px';ctx.setTransform(s*devicePixelRatio,0,0,s*devicePixelRatio,0,0);board.style.width=W*s+'px';board.style.height=H*s+'px';ox=(r.width-W*s)/2;oy=(r.height-H*s)/2;const d=document.querySelector('#dangerLabel');d.style.top=(oy+DANGER*s-14)+'px';d.style.right=(ox+18)+'px'}addEventListener('resize',layout);layout();
World.add(engine.world,[Bodies.rectangle(W/2,BOT+WALL/2,W,WALL,{isStatic:true,label:'wall'}),Bodies.rectangle(-WALL/2,(TOP+BOT)/2,WALL,BOT-TOP,{isStatic:true,label:'wall'}),Bodies.rectangle(W+WALL/2,(TOP+BOT)/2,WALL,BOT-TOP,{isStatic:true,label:'wall'})]);
let score=0,best=0;try{best=+(localStorage.getItem('wanyu_best_v2')||0)}catch{}document.querySelector('#best').textContent=best;
let fruits=[],particles=[],current=rand(),next=rand(),dropX=W/2,guide=true,canDrop=true,ended=false,overTimer=0,last=performance.now(),toastTimer=0,arrival=false;
function rand(){return DROP[Math.floor(Math.random()*DROP.length)]}function setNext(){document.querySelector('#nextImg').src=LEVELS[next].img;document.querySelector('#nextName').textContent=LEVELS[next].name}setNext();
const chain=document.querySelector('#chain');LEVELS.forEach((l,i)=>{if(i)chain.insertAdjacentHTML('beforeend','<span class="arr">›</span>');const item=document.createElement('div');item.className='chainitem';item.innerHTML='<img src="'+l.img+'" alt="'+l.name+'"><span>'+(i===4?'挽昼女士':l.name.split('·')[0])+'</span>';chain.append(item)});
const scoreEl=document.querySelector('#score');function updateScore(n){score+=n;scoreEl.textContent=score;if(score>best){best=score;document.querySelector('#best').textContent=best;try{localStorage.setItem('wanyu_best_v2',best)}catch{}}}
function spawn(level,x,y,vx=0,vy=0){const L=LEVELS[level],b=Bodies.circle(x,y,L.r,{restitution:.12,friction:.42,frictionStatic:.7,density:.00125,sleepThreshold:70,label:'fruit'});b.level=level;b.born=performance.now();Body.setVelocity(b,{x:vx,y:vy});World.add(engine.world,b);fruits.push(b);return b}
function burst(x,y,final=false){for(let i=0;i<(final?55:18);i++){let a=Math.random()*Math.PI*2,v=(final?2:1.2)+Math.random()*(final?6:3.2);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.3,life:.7+Math.random()*.55,r:1.5+Math.random()*(final?4:2.5),gold:Math.random()>.25})}}
let mergeQueue=[];Events.on(engine,'collisionStart',ev=>{for(const p of ev.pairs){let a=p.bodyA,b=p.bodyB;if(a.label!=='fruit'||b.label!=='fruit'||a.level!==b.level||a.level>=4||a.merging||b.merging)continue;a.merging=b.merging=true;mergeQueue.push({a,b,x:(a.position.x+b.position.x)/2,y:(a.position.y+b.position.y)/2,l:a.level+1})}});
function processMerges(){while(mergeQueue.length){const m=mergeQueue.shift();if(!fruits.includes(m.a)||!fruits.includes(m.b))continue;World.remove(engine.world,m.a);World.remove(engine.world,m.b);fruits=fruits.filter(f=>f!==m.a&&f!==m.b);const born=spawn(m.l,m.x,m.y,0,-1.1);born.born=performance.now()-1100;burst(m.x,m.y,m.l===4);updateScore(LEVELS[m.l-1].pts);if(m.l===4)arrive()}}
function arrive(){arrival=true;const t=document.querySelector('#toast');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);burst(W/2,TOP+95,true)}
function drop(){if(!canDrop||ended)return;canDrop=false;spawn(current,dropX,TOP+LEVELS[current].r+8);current=next;next=rand();setNext();setTimeout(()=>canDrop=true,360)}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function move(e){if(ended)return;const p=point(e);dropX=Math.max(LEVELS[current].r+WALL+2,Math.min(W-WALL-LEVELS[current].r-2,p.x));guide=true}
app.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e)});app.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;try{app.setPointerCapture(e.pointerId)}catch{}move(e);guide=true});app.addEventListener('pointerup',e=>{if(e.target.closest('button'))return;move(e);drop();guide=false});app.addEventListener('pointercancel',()=>guide=false);
function endGame(){ended=true;document.querySelector('#overlay').classList.add('show');document.querySelector('#finalScore').textContent=score;document.querySelector('#finalSub').textContent=arrival?'挽昼已降临。下一次，也让她再次现身吧。':'下一次，也让挽昼降临吧。';document.querySelector('#record').textContent=score>=best?'新的最高分！':'最高分　'+best}
function restart(){for(const f of fruits)World.remove(engine.world,f);fruits=[];particles=[];mergeQueue=[];score=0;scoreEl.textContent='0';ended=false;arrival=false;overTimer=0;canDrop=true;current=rand();next=rand();setNext();document.querySelector('#overlay').classList.remove('show');document.querySelector('#toast').classList.remove('show');document.querySelector('#dangerLabel').classList.remove('show')}
document.querySelector('#restart').addEventListener('click',restart);
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,TOP,0,BOT);bg.addColorStop(0,'#211b35');bg.addColorStop(1,'#171423');ctx.fillStyle=bg;ctx.fillRect(0,TOP,W,BOT-TOP);
// star glints
for(let i=0;i<20;i++){let x=(i*113+37)%W,y=TOP+((i*167+19)%(BOT-TOP));ctx.fillStyle='rgba(255,232,187,'+(0.09+(i%3)*.035)+')';ctx.beginPath();ctx.arc(x,y,1+(i%3)*.35,0,Math.PI*2);ctx.fill()}
// bowl frame and gilded corners
ctx.save();ctx.strokeStyle='rgba(248,216,151,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(WALL/2,TOP,W-WALL,BOT-TOP,18);ctx.stroke();ctx.strokeStyle='rgba(255,238,197,.55)';ctx.lineWidth=2.5;for(const [x,y,sx,sy] of [[WALL/2+3,TOP+16,1,1],[W-WALL/2-3,TOP+16,-1,1],[WALL/2+3,BOT-16,1,-1],[W-WALL/2-3,BOT-16,-1,-1]]){ctx.beginPath();ctx.moveTo(x,y+sy*14);ctx.lineTo(x,y);ctx.lineTo(x+sx*14,y);ctx.stroke()}ctx.restore();
ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='rgba(255,135,128,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(WALL+9,DANGER);ctx.lineTo(W-WALL-9,DANGER);ctx.stroke();ctx.restore();
if(!ended){let L=LEVELS[current],r=L.r;ctx.save();ctx.globalAlpha=.84;drawAvatar(current,dropX,TOP+13,r);ctx.restore();if(guide){ctx.save();ctx.setLineDash([3,9]);ctx.strokeStyle='rgba(255,248,225,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(dropX,TOP+r+20);ctx.lineTo(dropX,BOT-12);ctx.stroke();ctx.restore()}}
for(const f of fruits){ctx.save();ctx.translate(f.position.x,f.position.y);ctx.rotate(f.angle);drawAvatar(f.level,0,0,LEVELS[f.level].r);ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.gold?'#ffe5a5':'#fff8df';ctx.shadowColor=p.gold?'#f3ca71':'#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(.25,p.life),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
function drawAvatar(level,x,y,r){let im=imgs[level];if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.shadowColor=level===4?'#f6d5818a':'#09081288';ctx.shadowBlur=level===4?22:10;ctx.fillStyle=level===4?'#f6df9d':'#e7c77d';ctx.beginPath();ctx.arc(x,y,r+2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(x,y,r-1,0,Math.PI*2);ctx.clip();ctx.drawImage(im,x-r+1,y-r+1,(r-1)*2,(r-1)*2);ctx.restore()}
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000,.05);last=now;if(!ended){Engine.update(engine,16.667);processMerges();let danger=fruits.some(f=>now-f.born>1050&&f.position.y-LEVELS[f.level].r<DANGER);document.querySelector('#dangerLabel').classList.toggle('show',danger);overTimer=danger?overTimer+dt:0;if(overTimer>1.65)endGame()}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt*25;p.y+=p.vy*dt*25;p.vy+=.08;p.life-=dt;if(p.life<=0)particles.splice(i,1)}draw()}
requestAnimationFrame(tick);
})();
</script></body></html>
